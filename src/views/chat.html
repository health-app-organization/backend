<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Easy Care</title>
    <style>
        body {
            margin: 0;
            padding-bottom: 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #form {
            background: rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 3rem;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .user {
            border: none;
            padding: 5px 15px;
            background-color: gray;
            color: white;
            border-radius: 100px;
            margin: 5px;
        }

        .user:hover {
            cursor: pointer;
        }

        input {
            border: none;
            padding: 0 1rem;
            flex-grow: 1;
            border-radius: 2rem;
            margin: 0.25rem;
        }

        input:focus {
            outline: none;
        }

        [type="number"] {
            flex-grow: 0;
        }

        .online {
            background-color: rgb(17, 235, 17);
            color: white;
        }

        #form>button {
            background: #333;
            border: none;
            padding: 0 1rem;
            margin: 0.25rem;
            border-radius: 3px;
            outline: none;
            color: #fff;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        #messages>li {
            padding: 0.5rem 1rem;
        }

        #messages>li:nth-child(odd) {
            background: #efefef;
        }
    </style>
</head>

<body>
    <div>
        <button onclick="toggleConnection(1)" id="user1">User</button>
        <button onclick="toggleConnection(2)" id="user2">Provider</button>
    </div>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="1" type="text" placeholder="user">
        <input id="2" type="text" placeholder="provider">
        <!-- <input id="message" autocomplete="off" /> -->
        <!-- <button type="button">Send</button> -->
    </form>

    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
    <script>
        let socket = io();

        function toggleConnection(user_id) {
            socket.emit('toggle_user', user_id);
        }



        const form = document.getElementById('form');

        const messages = document.getElementById('messages');

        form.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                let id = Number(e.target.getAttribute('id'));
                let msg = e.target.value;

                let msgObj = {
                    from: id,
                    to: id === 1 ? 2 : 1,
                    role: id === 1 ? 'user' : 'provider',
                    message: msg
                }

                socket.emit('send-msg', msgObj);
                e.target.value = '';
            }
        })

        socket?.on('msg-recieve', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg.role + '>> ' + msg.message;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });

        socket?.on('connect', () => {
            console.log('Connected to server');
        });

        socket?.on('user_toggled', (msg) => {
            let user = document.getElementById('user' + msg.id);
            if (msg.online) {
                user.classList.add('online');
            } else {
                user.classList.remove('online');
            }
        })

        socket.on('user-offline', (id) => {
            const item = document.createElement('li');
            item.textContent = 'User ' + id + ' is offline';
            item.style.color = 'red';
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        })

    </script>
</body>

</html>
